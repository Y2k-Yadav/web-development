<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="to-do.png" type="image/png">
    <link rel="stylesheet" href="index.css">
    <title>Todo List</title>
</head>
<body>
    <div class="main">
        <h1>My Todo List</h1>
        <div class="firstdiv">
            <input type="text" id="input" placeholder="Enter your task">
            <button class="todo-btn">Add Todo</button>
        </div>
        <div class="todo-list">
            <!-- todo items will be added here dynamically by JS -->
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
