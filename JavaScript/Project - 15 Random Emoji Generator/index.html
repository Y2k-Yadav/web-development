<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap"
            rel="stylesheet">
        <link rel="shortcut icon" href="favicon.png" type="image/png">
        <link rel="stylesheet" href="index.css">
        <title>Random Emoji Generator</title>
    </head>
    <body>
        <div class="main">
            <h1>Random Emoji Generator</h1>
            <div class="display">
                <p class="emoji">💻</p>
            </div>
            <p class="emojiName">Computer</p>
            <button class="rndbtn">Click for Random Emoji</button>
            <div class="search">
                <input type="text" class="inputbox"
                    placeholder="Enter emoji name">
                <button class="srcbtn">Search</button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
