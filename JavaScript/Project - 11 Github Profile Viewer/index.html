<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="index.css">
        <link rel="icon" href="./github.png" type="image/png">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/fontawesome.min.css"
            integrity="sha512-WAQldzapOKc+yIZB/g4npsWhF43dQ74uxwR6WkySVIKVGKaVNSuRw19CQeqN2OmYmg34g7TsZv3sh9nsQXYj3g=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
        <title>Github Profile Viewer</title>
    </head>
    <body>
        <body>
            <div class="container">
                <div class="maindiv" id="main">
                    <h1 id="heading">GitHub Profile Viewer</h1>
                    <div class="firstdiv">
                        <div class="searchbar">
                            <input type="text"
                                placeholder="Enter Github Username"
                                id="username">
                        </div>
                        <div class="searchbutton">
                            <button class="button1"
                                id="search-button">Search</button>
                        </div>
                    </div>
                    <div class="secondiv" id="userprofile">
                        <div class="profile">
                            <div class="profile-image">
                                <img id="profilepicture"
                                    src="https://avatars.githubusercontent.com/u/583231?v=4"
                                    alt="octocat avatar">
                            </div>
                            <div class="profile-info">
                                <p id="login">monalisa octocat</p>
                                <p class="userid">@octocat</p>
                            </div>
                        </div>
                        <div class="bio">
                            <p>GitHub mascot and friend to all developers.</p>
                        </div>
                    </div>
                    <div class="thirdiv" id="followerslist">
                        <div class="detail repos">
                            <p>08</p>
                            <p>Repositories</p>
                        </div>
                        <div class="detail followers">
                            <p>23.2K</p>
                            <p>Followers</p>
                        </div>
                        <div class="detail following">
                            <p>09</p>
                            <p>Following</p>
                        </div>
                        <div class="detail joined">
                            <p>2011</p>
                            <p>Joined GitHub</p>
                        </div>
                    </div>
                    <div class="fourthdiv">
                        <button id="viewprofile">View profile</button>
                    </div>
                </div>

                <div class="signature">
                    Yadav
                </div>
            </div>

            <script src="index.js"></script>

            <script src="index.js"></script>
        </body>

    </html>
